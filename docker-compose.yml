services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gamebox
      POSTGRES_PASSWORD: gamebox
      POSTGRES_DB: gamebox
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/internal/db/migrations:/docker-entrypoint-initdb.d
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamebox -d gamebox"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - appnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgres://gamebox:gamebox@db:5432/gamebox?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "3600:3600"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet

  fe:
    build:
      context: ./fe
    ports:
      - "3601:80"
    networks:
      - appnet

volumes:
  pgdata:

networks:
  appnet:
    driver: bridge
